name: Deploy Orion API

on:
  push:
    branches:
      - main
      - fix/**
  pull_request:

jobs:
  source:
    name: Source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Commit Information
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          echo "Triggered at: $(date)"
  build:
    name: Build
    needs: source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: .

 